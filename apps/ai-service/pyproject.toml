[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geoharmonix-ai-service"
version = "2.0.4"
authors = [{name = "debbjitttt__", email = "rossdebb452@gmail.com"}]
description = "Dual-System LangGraph reasoning harness with a Deterministic Tool Gate, grounded narratives and human sign-off for GeoHarmonix"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyjwt>=2.8",
    "flare-chronos-core",
]

[tool.uv.sources]
flare-chronos-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ai_service"]
